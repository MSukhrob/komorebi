# nginx site for komorebi.uz -> Komorebi app on 127.0.0.1:4100
# Install:  sudo cp deploy/nginx/komorebi.uz.conf /etc/nginx/sites-available/komorebi.uz
#           sudo ln -s /etc/nginx/sites-available/komorebi.uz /etc/nginx/sites-enabled/komorebi.uz
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d komorebi.uz -d www.komorebi.uz
#           (then set COOKIE_SECURE=true in .env and restart the app)

server {
    listen 80;
    listen [::]:80;
    server_name komorebi.uz www.komorebi.uz;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
